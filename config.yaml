# SSN v2 — Sequence Similarity Network Pipeline Configuration
# 
# Purpose: Configure the complete SSN pipeline (Python-only):
#   1. Redundancy reduction via clustering
#   2. All-vs-all sequence similarity search
#   3. Interactive network visualization
#
# Usage:
#   python run_ssn.py [--config config.yaml] [--steps all|cluster|search|plot_ssn]
#   python scripts/plot_ssn.py config.yaml

# ══════════════════════════════════════════════════════════════════════════════
# INPUT DATA
# ══════════════════════════════════════════════════════════════════════════════

input_fasta: "data/GH43_characerized.fa"   # Path to FASTA file for analysis
                                           # For foldseek: path to PDB/mmCIF directory
prefix: "full_ssn"                        # Prefix for all output files
output_dir: "results/GH43_characterized/"                      # Directory for all outputs


# ══════════════════════════════════════════════════════════════════════════════
# REDUNDANCY REDUCTION (Clustering)
# ══════════════════════

cluster:
  skip: false                              # Set to true to skip redundancy reduction entirely
                                           # All-vs-all search will run on the full input FASTA
  tool: mmseqs                             # mmseqs | foldseek
  min_seq_id: 0.4                 # Minimum sequence identity (0.0-1.0)
  coverage: 0.4              # Minimum coverage (0.0-1.0)
  cov_mode: 1                              # Coverage mode:
                                           #   0 = bidirectional coverage
                                           #   1 = query coverage
                                           #   2 = target coverage
                                           #   3 = max(query, target) coverage


# ══════════════════════════════════════════════════════════════════════════════
# ALL-VS-ALL SIMILARITY SEARCH
# ══════════════════════════════════════════════════════════════════════════════

search:
  tool: mmseqs                             # mmseqs | foldseek
  sensitivity: 7.5                         # mmseqs sensitivity (1.0-10.0+)
                                           # Higher = more sensitive, slower
                                           # foldseek ignores this parameter
  evalue: 1e-10                            # E-value threshold (mmseqs only)
  results_file: null                       # Path to existing m8 file — skips mmseqs search entirely
                                           # Set to use pre-computed results (e.g. a BLAST m8 file)


# ══════════════════════════════════════════════════════════════════════════════
# ANNOTATION & COLORING
# ══════════════════════════════════════════════════════════════════════════════

annotation:
  meta_file: "/Users/maartenboneschansker/Documents/PhD/projects/cazyme_data_collection/2026-09-24_download/consolidated/characterized_ALL.tsv"              # TSV with sequence annotations
                                           # Must have header row
                                           # First column should match sequence IDs
  id_col: "GenBank"                        # Column name in meta_file that matches
                                           # sequence IDs from input_fasta
  color_col:                               # One or more columns to color nodes by
    - "target name"                        # Creates one plot per color column
  exclude:                                  # Filter out rows from meta_file before annotation
    "target name":                          # Column name to filter on
      - "CBM*"                             # Exclude all CBM domain entries (fnmatch patterns)
  id_mapping_file: null                    # Optional: two-column TSV for ID mapping
                                           # Format: genbank_id ↔ uniprot_id (no header)
                                           # Use if sequence IDs differ between input
                                           # and annotation file
  mmseqs_cluster_file: null                # Auto-populated from cluster step
                                           # Leave as null to auto-detect


# ══════════════════════════════════════════════════════════════════════════════
# SEQUENCE SIMILARITY NETWORK (SSN) PLOTTING
# ══════════════════════════════════════════════════════════════════════════════

ssn:
  threshold:                               # Identity thresholds for separate plots
    - 0.6                                  # 30% identity                                 # 50% identity
    - 0.4                            # 70% identity
  node_size: 4                        # Node marker size (0.1-10.0)
  layout: component_grid                   # Layout: component_grid (fast), lgl, fr, drl, kk, circle, grid
  exclude_singletons: false                 # Exclude one-node connected components from plots
  keep_all_nodes: true                   # Keep all nodes from original data, even those with only below-threshold edges
                                           # When true, nodes that had no edges above the threshold appear as isolated nodes
  scale_node_size: false                   # Scale node area by cluster member count
                                           # (requires mmseqs_cluster_file)


# ══════════════════════════════════════════════════════════════════════════════
# GRAPH ANALYSIS METRICS (Optional)
# ══════════════════════════════════════════════════════════════════════════════

graph_metrics:
  enabled: false                           # Master switch — off by default
  preset: standard                         # fast | standard | full | custom
                                           #   fast:     basic + density/transitivity + boolean checks
                                           #   standard: + distributions, connectedness, modularity,
                                           #             per-vertex centrality (betweenness, pagerank, ...)
                                           #   full:     + cliques, motifs, independent sets, separators,
                                           #             edge metrics (guarded, can be slow on dense graphs)
                                           #   custom:   nothing on by default; set flags below explicitly

  guards:                                  # Hard caps enforced regardless of preset
    max_nodes_mincut: 5000                 # Skip mincut() above this node count
    max_nodes_cliques: 500                 # Per-component cap for cliques/motifs/
                                           # independent-sets/separators (combinatorial)
    max_cliques_returned: 100000           # Cap on maximal_cliques() enumeration size

  global:                                  # Category toggles (override preset per-key)
    basic: true                            # diameter, radius, average_path_length, girth
    distributions: true                    # degree_distribution, path_length_hist
    connectedness: true                    # articulation_points, biconnected_components
    cliques_motifs: false                  # clique_number, (maximal/largest) cliques, motifs
    separators: false                      # all_minimal_st_separators, minimum_size_separators
    optimality: true                       # farthest_points, mincut, modularity (via Louvain)
    independence_sets: false                # independence_number, (maximal/largest) independent sets
    other_measures: true                   # assortativity_degree, density, transitivity
    boolean_props: true                    # is_bipartite, is_connected, is_simple, has_multiple, ...

  vertex:
    enabled: true
    structural: true                       # betweenness, closeness, pagerank, coreness,
                                           # eigenvector/harmonic centrality, coreness, etc.
    personalized_pagerank:
      enabled: false
      reset_col: null                      # metadata column of seed-vertex flags (optional)

  edge:
    enabled: false                         # is_loop, is_multiple, count_multiple, edge_betweenness

  components:
    enabled: true                          # one row per connected component (diameter, density,
                                           # clique_number, modularity, ...) — reuses the `global`
                                           # toggles/guards above, scoped to each component

  output:
    write_vertex_table: true               # write {prefix}_t{thresh}_vertex_metrics.tsv
                                           # (includes component_id/community_id columns)
    write_edge_table: false                # write {prefix}_t{thresh}_edge_metrics.tsv
    write_component_table: true            # write {prefix}_t{thresh}_component_metrics.tsv
    color_with: []                         # metric name(s) to add as extra color_col plots,
                                           # e.g. ["betweenness", "pagerank", "community_id"]


# ══════════════════════════════════════════════════════════════════════════════
# CLUSTERING FOR VISUALIZATION (Optional)
# ══════════════════════════════════════════════════════════════════════════════

clusters:
  min_cluster_size: 2                      # Minimum cluster size for visualization
  color_col: isoelectric_point                            # Column to color clusters by
  size_col: null                           # Column for node size scaling (numeric)
